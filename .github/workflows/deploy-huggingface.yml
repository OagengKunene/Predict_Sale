name: Deploy Predict_Sale to Hugging Face

"on":
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "huggingface/**"
      - "project/prepare_huggingface.py"
      - "project/test_engine.mjs"
      - "project/python_fixtures.json"
      - "package.json"
      - ".github/workflows/deploy-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-predict-sale
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      HF_OIDC_RESOURCE: spaces/Oageng/Predict_Sale
    steps:
      - name: Check out the project
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Verify the forecasting engine
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Prepare the static Space
        run: python project/prepare_huggingface.py --output "$RUNNER_TEMP/predict-sale-space"

      - name: Install the Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==2.4.0"

      - name: Publish through the trusted publisher
        run: >-
          hf upload Oageng/Predict_Sale
          "$RUNNER_TEMP/predict-sale-space" .
          --repo-type space
          --revision main
          --commit-message "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
